<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src 'unsafe-inline'; font-src file:">
<title>TRACS</title>
<style>
  html, body { margin: 0; background: #1a1a1a; }
  body {
    font-family: 'Roboto Mono', monospace;
    color: #aaa; font-size: 13px; line-height: 1.5;
    padding: 18px 22px;
  }
  .title { color: #ddd; font-size: 14.5px; margin-bottom: 10px; }
  p { margin: 0 0 8px; }
  code { color: #ccc; }
  .error { color: #e77; margin-bottom: 12px; }
  .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  button {
    background: #222; border: 1px solid #444; border-radius: 3px; color: #ccc;
    padding: 5px 12px; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  button:hover:not(:disabled) { background: #2a2a2a; }
  button:disabled { cursor: default; opacity: 0.6; }
  button.primary { border-color: #4488cc; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="title" id="title"></div>
  <p id="owner"></p>
  <p>Your saved settings belong to this port. Close that program, then click Retry to continue normally.</p>
  <p id="fallback-text"></p>
  <p class="error" id="error" hidden></p>
  <div class="buttons">
    <button id="quit">Quit</button>
    <button id="fallback"></button>
    <button id="retry" class="primary">Retry</button>
  </div>
  <script src="portConflict.js"></script>
</body>
</html>
