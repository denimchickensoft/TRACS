name: Download badge

# The README's downloads badge. GitHub counts every fetch of a release file
# as a download, and the in-app updater fetches latest*.yml on each update
# check and the .blockmap for differential updates, so shields.io's own
# total mostly counts app launches. This sums only the files people download
# to install: the TRACS installers and the relay executables. The result is
# a shields.io endpoint JSON on the `badges` branch, which holds nothing else
# and is replaced (one commit) on every change.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Count downloads
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[].assets[] | select(.name | test("^TRACS-Setup-.*[.]exe$|[.]dmg$|[.]AppImage$|^TRACS-Relay([.]exe)?$")) | .download_count' \
            | awk '{ s += $1 } END { print s + 0 }')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Downloads: $total"

      - name: Publish to the badges branch
        env:
          TOTAL: ${{ steps.count.outputs.total }}
          GH_TOKEN: ${{ github.token }}
        run: |
          json="{\"schemaVersion\":1,\"label\":\"downloads\",\"message\":\"$TOTAL\",\"color\":\"brightgreen\"}"
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/downloads.json?ref=badges" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
          if [ "$current" = "$json" ]; then echo "Unchanged"; exit 0; fi
          mkdir badge && cd badge
          git init -q -b badges
          printf '%s' "$json" > downloads.json
          git add downloads.json
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Download badge: $TOTAL"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" badges
