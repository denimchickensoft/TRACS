name: Release TRACS

# Tag-triggered matrix build producing installers for all three platforms,
# attached to one GitHub Release.
# The git tag is the single source of truth for the version — read here and
# written into package.json at build time, never hand-edited. TRACS tags are
# plain `vX.Y.Z` because that's the tag electron-builder publishes to and
# electron-updater looks for; the relay uses `relay-vX.Y.Z`.
on:
  push:
    tags:
      - 'v*'

# The repo's default GITHUB_TOKEN is read-only; publishing a release needs
# write access to contents.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          # Oldest hosted Ubuntu runner, not floating ubuntu-latest:
          # better-sqlite3 is compiled from source here, so this runner's
          # glibc (2.35) is the AppImage's minimum. Bump when GitHub retires it.
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Stage bundled navdata
        run: npm run stage-navdata

      # Electron's Node headers need GCC >= 12.2 (Node 24's minimum); the
      # runner's default is GCC 11, which rejects them. GCC 12 is preinstalled
      # on this image. Only the compiler changes; the glibc floor stays 2.35.
      - name: Use GCC 12
        if: matrix.target == 'linux'
        run: |
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - name: Stage better-sqlite3 rebuilt for Electron
        run: npm run stage-better-sqlite3

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds aren't code-signed - skip
          # electron-builder's cert auto-discovery so it doesn't try to fetch
          # its winCodeSign helper package (macOS signing tooling probed even
          # for non-mac targets) at all.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --${{ matrix.target }} --publish always
