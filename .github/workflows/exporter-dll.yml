name: Exporter DLL

# Builds the exporter DLL (MSVC, found by relay/native/build.js through
# vswhere) and runs it against a fake relay, so a C compile error or a broken
# DLL shows up here rather than on a relay-v* tag. Runs only when something
# the DLL or its test uses changes, plus weekly (to catch a runner image or
# toolchain change) and on demand. The relay release builds it again anyway.
on:
  push:
    branches: [master]
    paths:
      - 'relay/native/**'
      - 'relay/dcs/**'
      - 'test/relay/exporterDll.test.js'
      - 'test/relay/fixtures/exporterHarness.lua'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/exporter-dll.yml'
  pull_request:
    paths:
      - 'relay/native/**'
      - 'relay/dcs/**'
      - 'test/relay/exporterDll.test.js'
      - 'test/relay/fixtures/exporterHarness.lua'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/exporter-dll.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes an in-progress run.
concurrency:
  group: exporter-dll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exporter-dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build tracs_exporter.dll and its Lua test harness
        run: node relay/native/build.js --harness

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Run the DLL against a fake relay
        run: npx vitest run test/relay/exporterDll.test.js
