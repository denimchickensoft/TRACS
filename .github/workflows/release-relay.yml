name: Release TRACS Relay

# Tag-triggered matrix build producing standalone Relay executables (Node
# SEA — no installer, just a binary + config.example.json), attached to one
# GitHub Release. Windows + Linux only — there's no real Mac server
# hosting market for a relay.
on:
  push:
    tags:
      - 'relay-v*'

# The repo's default GITHUB_TOKEN is read-only; publishing a release needs
# write access to contents.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is fine: the SEA embeds the official Node binary,
        # whose glibc floor doesn't depend on the runner. If the relay ever
        # gains a native dependency, pin an old runner like release-tracs.yml.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set version from tag
        shell: bash
        working-directory: relay
        run: |
          VERSION="${GITHUB_REF_NAME#relay-v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: relay
        run: npm ci

      - name: Build
        working-directory: relay
        run: npm run build

      # Both jobs build an identical config.example.json; only the Linux job
      # uploads it, so the two don't race to publish the same asset name.
      - name: Keep config.example.json to one job
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f relay/dist/config.example.json

      # The notices for what the executables bundle (Node.js, ws, and the
      # exporter DLL's cJSON and Lua headers). Linux job only, for the same
      # reason as config.example.json.
      - name: Add third-party notices
        if: runner.os == 'Linux'
        shell: bash
        run: cp THIRD_PARTY_NOTICES.md relay/dist/

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: relay/dist/*
          # Never mark a relay release as the repo's "latest": TRACS's
          # electron-updater resolves updates via GitHub's single latest-release
          # pointer, so a relay release there would hide TRACS updates.
          make_latest: false

  # Multi-arch container image on GHCR, built from source alongside the SEA
  # binaries. Tagged X.Y.Z, X.Y and latest. GHCR creates a new package as
  # private; its visibility is switched to public once, by hand.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/tracs-relay
          tags: |
            type=match,pattern=relay-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=relay-v(\d+\.\d+),group=1
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=TRACS Relay

      - name: Set version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#relay-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          build-args: RELAY_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
